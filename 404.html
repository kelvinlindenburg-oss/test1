<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Play Pong for a Discount</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1e24, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .subtitle span {
      color: var(--accent);
      font-weight: 600;
    }

    .game-wrapper {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      touch-action: none;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .game-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .game-modal h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .game-modal p {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .coupon-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 6px 14px;
      gap: 12px;
      margin-bottom: 20px;
    }

    .coupon-code {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .btn {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 18px;
      transition: background 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: var(--card-bg);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .instructions {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="badge">404 Error</div>
    <h1>Lost your way? Find a discount instead.</h1>
    <p class="subtitle">
      Beat the AI to <span>3 points</span> to claim your <strong>15% off</strong> checkout code.
    </p>

    <div class="game-wrapper" id="gameWrapper">
      <canvas id="pongCanvas" width="600" height="380"></canvas>

      <div class="game-modal" id="gameModal">
        <h2 id="modalTitle">Victory!</h2>
        <p id="modalDesc">You outplayed our AI. Use the coupon code below at checkout.</p>
        
        <div class="coupon-box" id="couponBox">
          <span class="coupon-code">PONG15</span>
          <button class="btn btn-primary" id="copyBtn" onclick="copyCoupon()">Copy</button>
        </div>

        <div class="modal-actions">
          <button class="btn btn-outline" onclick="restartGame()">Play Again</button>
          <a href="/" class="btn btn-primary">Return to Homepage</a>
        </div>
      </div>
    </div>

    <p class="instructions">Controls: <strong>W/S</strong> or <strong>Up/Down arrows</strong> (or drag directly on touchscreens)</p>
  </main>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');
    const modal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const couponBox = document.getElementById('couponBox');
    const copyBtn = document.getElementById('copyBtn');

    const WINNING_SCORE = 3;
    let isGameOver = false;

    let audioCtx = null;
    function playSound(freq, duration) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const paddleWidth = 10;
    const paddleHeight = 70;

    const player = {
      x: 18,
      y: canvas.height / 2 - paddleHeight / 2,
      score: 0,
      speed: 6.5,
      targetY: null
    };

    const ai = {
      x: canvas.width - 18 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      score: 0,
      speed: 4.8
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 6,
      speed: 5.5,
      dx: 5.5,
      dy: 0
    };

    const keys = {};
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'w', 's', 'W', 'S'].includes(e.key)) {
        keys[e.key.toLowerCase()] = true;
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'ArrowDown', 'w', 's', 'W', 'S'].includes(e.key)) {
        keys[e.key.toLowerCase()] = false;
      }
    });

    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const relativeY = clientY - rect.top;
      const scaleY = canvas.height / rect.height;
      player.targetY = (relativeY * scaleY) - (paddleHeight / 2);
    }

    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('touchmove', handlePointerMove, { passive: true });
    canvas.addEventListener('touchstart', handlePointerMove, { passive: true });

    function resetBall(servingPlayer) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5.5;
      ball.dx = servingPlayer === 'player' ? -5.5 : 5.5;
      ball.dy = (Math.random() - 0.5) * 6;
    }

    function checkPaddleHit(paddle) {
      return (
        ball.x - ball.radius < paddle.x + paddleWidth &&
        ball.x + ball.radius > paddle.x &&
        ball.y - ball.radius < paddle.y + paddleHeight &&
        ball.y + ball.radius > paddle.y
      );
    }

    function update() {
      if (isGameOver) return;

      if (keys['arrowup'] || keys['w']) {
        player.y -= player.speed;
        player.targetY = null;
      } else if (keys['arrowdown'] || keys['s']) {
        player.y += player.speed;
        player.targetY = null;
      }

      if (player.targetY !== null) {
        player.y += (player.targetY - player.y) * 0.25;
      }

      player.y = Math.max(0, Math.min(canvas.height - paddleHeight, player.y));

      const aiTarget = ball.y - paddleHeight / 2;
      if (ai.y < aiTarget - 8) ai.y += ai.speed;
      else if (ai.y > aiTarget + 8) ai.y -= ai.speed;
      ai.y = Math.max(0, Math.min(canvas.height - paddleHeight, ai.y));

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.dy = -ball.dy;
        playSound(260, 0.05);
      }

      const paddle = ball.dx < 0 ? player : ai;
      if (checkPaddleHit(paddle)) {
        const hitOffset = (ball.y - (paddle.y + paddleHeight / 2)) / (paddleHeight / 2);
        const maxAngle = Math.PI / 4;
        const angle = hitOffset * maxAngle;

        const direction = ball.dx < 0 ? 1 : -1;
        ball.speed = Math.min(ball.speed + 0.35, 12);
        ball.dx = direction * ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);

        playSound(ball.dx > 0 ? 440 : 380, 0.06);
      }

      if (ball.x + ball.radius < 0) {
        ai.score++;
        playSound(180, 0.15);
        if (ai.score >= WINNING_SCORE) triggerGameOver(false);
        else resetBall('player');
      } else if (ball.x - ball.radius > canvas.width) {
        player.score++;
        playSound(620, 0.15);
        if (player.score >= WINNING_SCORE) triggerGameOver(true);
        else resetBall('ai');
      }
    }

    function render() {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#27272a';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#71717a';
      ctx.font = '700 32px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(player.score, canvas.width / 4, 50);
      ctx.fillText(ai.score, (canvas.width * 3) / 4, 50);

      ctx.fillStyle = '#10b981';
      ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);

      ctx.fillStyle = '#a1a1aa';
      ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);

      ctx.fillStyle = '#fafafa';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver(playerWon) {
      isGameOver = true;
      if (playerWon) {
        modalTitle.innerText = "You Won!";
        modalTitle.style.color = "var(--accent)";
        modalDesc.innerText = "Nice reflexes! Here is your 15% discount for your first checkout:";
        couponBox.style.display = "flex";
      } else {
        modalTitle.innerText = "AI Wins This Round!";
        modalTitle.style.color = "var(--danger)";
        modalDesc.innerText = "Close match! Give it another shot to claim your 15% discount code.";
        couponBox.style.display = "none";
      }
      modal.classList.add('visible');
    }

    function restartGame() {
      player.score = 0;
      ai.score = 0;
      modal.classList.remove('visible');
      resetBall('player');
      isGameOver = false;
    }

    function copyCoupon() {
      navigator.clipboard.writeText('PONG15').then(() => {
        copyBtn.innerText = 'Copied!';
        setTimeout(() => {
          copyBtn.innerText = 'Copy';
        }, 2000);
      });
    }

    resetBall('player');
    gameLoop();
  </script>
</body>
</html>
